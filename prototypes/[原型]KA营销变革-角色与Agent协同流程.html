    if(!okScene(e.st.sc)||!okScene(e.bsc)) return;

  const nHa=rows.filter(x=>x.mine&&x.st.k==='ha').length;
  let h=`<div class="rhead">
    <div>
      <div class="flex items-center gap-2 flex-wrap">
        <span class="rname">${esc(r.n)}</span>
        ${(r.ag||[]).map(a=>`<span class="agt">${esc(a)}</span>`).join('')}
      </div>
      <div class="info mt-1">${esc(r.s)}</div>
    </div>
    <div class="flex items-center gap-2 flex-wrap">
      <span class="rstat">承担节点 <b>${nMine}</b></span>
      <span class="rstat">其中 AI辅助 <b>${nHa}</b></span>
      <span class="rstat">Agent 代办 <b>${nAi}</b></span>
      <span class="rstat">主判关卡 <b>${nGate}</b></span>
    </div></div>`;
  const own=rows.filter(x=>x.mine);
  const f=own[0],l=own[own.length-1];
  const ri=RINFO[r.id]||{};
  const pt=(e,lbl,cls)=>`
    <div class="ioc">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="iok ${cls}">${lbl}</span>
        <span class="ios">阶段 ${SNO[e.stage]||'—'} · ${esc(e.stage)}</span>
        ${e.br?`<span class="hbr">${esc(e.br)}</span>`:''}
      </div>
      <div class="iot">${esc(e.txt)}</div>
    </div>`;
  if(f&&l){
    const one=f.stage===l.stage&&f.br===l.br;
    h+=`<div class="ioband" style="${one?'grid-template-columns:1fr':''}">
          ${pt({stage:f.stage,br:f.br,txt:ri.ein||''},'进入','iok-in')}
          ${one?'':pt({stage:l.stage,br:l.br,txt:ri.eout||''},'退出','iok-out')}
        </div>
        ${one&&ri.eout?`<div class="ionote"><b class="text-[#92400e]">退出 · </b>${esc(ri.eout)}</div>`:''}
        ${ri.note?`<div class="ionote">${esc(ri.note)}</div>`:''}`;
  }
  const vis=rows.filter(x=>x.gate?1:keepK(x.st.k));
  if(!vis.length) h+=`<div class="lane"><div class="lstage-c">—</div>
    <div><span class="hnone">当前筛选下该角色无节点</span></div><div class="hoff"></div></div>`;
  let prev='';
  vis.forEach(row=>{
    if(row.gate){
      const g=row.gate;
      const bt=Array.isArray(g.basis)?g.basis.map(b=>b[1]).join('；'):g.basis;
      h+=`<div class="lane">
            <div class="lstage-c">—</div>
            <div class="${g.flex?'gaterow-flex':'gaterow'}">
              <div class="${g.flex?'gate-title-flex':'gate-title'}">${esc(g.short||g.n)}</div>
              <div class="mt-1 flex flex-wrap items-center gap-1">
                <span class="${g.flex?'gate-owner-flex':'gate-owner'}">判断主体 · ${esc(g.decBy||g.owner)}</span>
                ${g.flex?'<span class="flexbdg">机动流程</span>':''}</div>
              <div class="txt mt-1.5">${esc((row.gbrs||[]).map(b=>b[1]).join(' / '))}</div>
            </div>
            <div class="hoff">
              <div class="hrow"><span class="hk">职责</span>
                <span class="hv">${g.co?'与 '+esc(plNames(g.owner).includes(r.n)?g.co:g.owner)+' 共同决策':'本角色为判断主体'}，依据：${esc(bt)}</span></div>
              ${g.out?`<div class="hrow"><span class="hk">必出</span>
                <span class="hv">${esc(g.out.join('；'))}</span></div>`:''}
            </div>
          </div>`;
      prev='';
      return;
    }
    const sameStage=row.stage===prev; prev=row.stage;
    h+=`<div class="lane">
          <div class="${sameStage?'lstage-c':'lstage'}">${sameStage?'↳':esc(row.stage)}</div>
          <div>${stepHtml(row.st)}</div>
          <div class="hoff">`;
    if(row.ai){
      h+=`<div class="hrow"><span class="aidel">Agent 代办</span>
            <span class="hv">${row.feeds?'产出直接进入本角色的下一个节点':'产出供本角色在该阶段取用'}</span></div>`;
    }else{
      if(row.br) h+=`<div class="hrow"><span class="hk">分支</span>
        <span class="hv">${esc(row.q)} · </span><span class="hbr">${esc(row.br)}</span></div>`;
      h+=`<div class="hrow"><span class="hk">上游</span>${sideHtml(row.up,-1)}</div>`;
      h+=`<div class="hrow"><span class="hk">下游</span>${sideHtml(row.dn,1)}</div>`;
    }
    h+=`</div></div>`;
  });
  document.getElementById('rolev').innerHTML=h;
}
function rolesel(){
  const vis=RV.filter(r=>okScene(r.sc));
  if(!vis.some(r=>r.id===rsel)) rsel=vis[0].id;
  document.getElementById('rolesel').innerHTML=vis.map(r=>
    `<button onclick="setRole('${r.id}')" class="flt text-[11.5px] rounded-lg px-3 py-1.5 border ${
      rsel===r.id?'bg-[#7033ff] text-white border-[#7033ff]':'bg-white text-[#4b5563] border-[#e5e0f5] hover:bg-[#f8f6ff]'
    }">${r.n}</button>`).join('');
}
function setRole(k){ rsel=k; rolesel(); renderRole(); }
const TABS=[['grid','矩阵视图'],['flow','协同流程图'],['role','角色流程图']];
let view='grid';
function tabs(){
  document.getElementById('tabs').innerHTML=TABS.map(([k,n])=>
    `<button onclick="setView('${k}')" class="flt text-[12px] font-medium rounded-lg px-3.5 py-1.5 border ${
      view===k?'bg-[#2d235a] text-white border-[#2d235a]':'bg-white text-[#4b5563] border-[#e5e0f5] hover:bg-[#f8f6ff]'
    }">${n}</button>`).join('');
}
function legend(){
  if(view==='role'){
    document.getElementById('legend').innerHTML=
      `<span class="flex items-center gap-1"><span class="tag tag-h">人</span>纯人工</span>
       <span class="flex items-center gap-1"><span class="tag tag-ha">AI辅助 + 人主导</span></span>
       <span class="flex items-center gap-1"><span class="aidel">Agent 代办</span>该角色智能体自动完成</span>
       <span class="flex items-center gap-1"><span class="hrole">上下游角色</span></span>
       <span class="flex items-center gap-1"><span class="hgate">经营决策关卡</span></span>`;
    return;
  }
  document.getElementById('legend').innerHTML = view==='grid'
    ? `<span class="flex items-center gap-1"><span class="tag tag-h">人</span>人工执行 / 决策</span>
       <span class="flex items-center gap-1"><span class="tag tag-a">AI</span>Agent 自动处理</span>
       <span class="flex items-center gap-1"><span class="agt">Agent</span>该角色可用智能体</span>
       <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm" style="background:#fef3c7;border:1px solid #fde68a"></span>经营决策关卡</span>
       <span class="flex items-center gap-1"><span class="flexbdg">机动流程</span>按需触发，非每单必走</span>
       <span class="flex items-center gap-1"><span class="gk gk-req">必</span><span class="gk gk-opt">选</span>判断依据</span>
       <span class="flex items-center gap-1"><span class="gk gk-out">出</span>决策必要输出</span>
       <span class="flex items-center gap-1"><span class="bdg bdg-ns">非标场景</span><span class="bdg bdg-std">标准场景</span>场景专属角色</span>`
    : `<span class="flex items-center gap-1"><span class="tag tag-h">人</span>纯人工节点</span>
       <span class="flex items-center gap-1"><span class="tag tag-a">AI</span>Agent 全自动节点</span>
       <span class="flex items-center gap-1"><span class="tag tag-ha">AI辅助 + 人主导</span></span>
       <span class="flex items-center gap-1"><span class="ch ch-sys">系统操作</span><span class="ch ch-off">线下</span>行动方式</span>
       <span class="flex items-center gap-1"><span class="bdg bdg-lead">主导</span></span>
       <span class="flex items-center gap-1"><span class="bdg bdg-ns">非标场景</span><span class="bdg bdg-std">标准场景</span>仅该场景执行</span>
       <span class="flex items-center gap-1"><span class="flexbdg">机动流程</span>按需触发，非每单必走</span>
       <span class="flex items-center gap-1"><span class="bdg bdg-new">新增节点</span></span>`;
}
function setView(k){
  view=k;
  document.getElementById('wrap').classList.toggle('hidden',k!=='grid');
  document.getElementById('flow').classList.toggle('hidden',k!=='flow');
  document.getElementById('rolev').classList.toggle('hidden',k!=='role');
  document.getElementById('ctrl').classList.remove('hidden');
  document.getElementById('rolesel').classList.toggle('hidden',k!=='role');
  tabs();legend();
}
const MODES=[['all','全部'],['h','只看人'],['a','只看 Agent']];
let mode='all';
function ctrl(){
  document.getElementById('ctrl').innerHTML=MODES.map(([k,n])=>
    `<button onclick="setMode('${k}')" class="flt text-[11.5px] rounded-lg px-3 py-1.5 border ${
      mode===k?'bg-[#7033ff] text-white border-[#7033ff]':'bg-white text-[#4b5563] border-[#e5e0f5] hover:bg-[#f8f6ff]'
    }">${n}</button>`).join('');
}
function setMode(k){
  mode=k;
  const w=document.getElementById('wrap');
  w.classList.toggle('hide-a',k==='h');
  w.classList.toggle('hide-h',k==='a');
  ctrl();renderFlow();renderRole();
}
const SCENES=[['all','全部场景'],['std','标准场景'],['ns','非标场景']];
function scenectrl(){
  document.getElementById('scenectrl').innerHTML=SCENES.map(([k,n])=>
    `<button onclick="setScene('${k}')" class="flt text-[11.5px] rounded-lg px-3 py-1.5 border ${
      scene===k?(k==='ns'?'bg-[#b45309] text-white border-[#b45309]'
                :k==='std'?'bg-[#0f766e] text-white border-[#0f766e]'
                :'bg-[#2d235a] text-white border-[#2d235a]')
               :'bg-white text-[#4b5563] border-[#e5e0f5] hover:bg-[#f8f6ff]'
    }">${n}</button>`).join('');
}
function setScene(k){
  scene=k;
  scenectrl();render();renderFlow();rolesel();renderRole();
}
render();renderFlow();renderRole();ctrl();scenectrl();rolesel();tabs();legend();
</script>
</body>
</html>
