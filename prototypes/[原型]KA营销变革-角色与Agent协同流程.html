function dimRows(o){
  return Object.entries(DIMS).map(([k,v])=>o[k]?
    `<div class="dim-row"><span class="dim-k" style="color:${v.c}">${v.n}</span><span class="dim-v">${o[k]}</span></div>`:'').join('');
}
function actorBlock(o,who){
  const isH=who==='H';
  return `<div class="actor ${isH?'actor-h':'actor-a'}">
    <div class="actor-t" style="color:${isH?'#3B4BFF':'#4929e2'}">${isH?'人':'Agent'}</div>
    ${dimRows(o)}
  </div>`;
}
function chainHtml(ch){
  return `<div class="chain">${ch.map(x=>{
    const isH=x.startsWith('H ');
    return `<span class="ch ${isH?'ch-h':'ch-a'}">${isH?'人':'AI'} ${x.slice(2)}</span>`;
  }).join('<span class="ch-ar">▸</span>')}</div>`;
}

function renderFilters(){
  document.getElementById('typeFilters').innerHTML=Object.entries(TYPES).map(([k,v])=>
    `<button data-k="${k}" class="flt px-3 py-1.5 rounded-lg text-xs font-medium border border-[#ece8fd] bg-[#f8f6ff] text-[#4929e2]">
      <span class="inline-block w-2 h-2 rounded-full ${v.b} mr-1.5 align-middle"></span>${v.n}
     </button>`).join('');
  document.querySelectorAll('#typeFilters button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k; active[k]=!active[k];
    b.className=`flt px-3 py-1.5 rounded-lg text-xs font-medium border ${active[k]?'border-[#ece8fd] bg-[#f8f6ff] text-[#4929e2]':'border-gray-200 bg-white text-gray-400'}`;
    document.querySelectorAll('.node').forEach(n=>n.classList.toggle('dim',!active[n.dataset.t]));
  });
  document.getElementById('leanBtn').onclick=()=>{
    lean=!lean;
    document.getElementById('laneWrap').classList.toggle('lean',lean);
    document.getElementById('leanBtn').textContent=lean?'切换详细视图':'切换精简视图';
  };
}

function renderStats(){
  const cnt=t=>NODES.filter(n=>n.t===t).length;
  const au=NODES.filter(n=>!n.H).length;
  document.getElementById('statBar').innerHTML=
    `<div class="bg-white rounded-xl border border-gray-200 px-4 py-2.5 text-xs">
       <span class="text-[#8284A4]">节点总数</span>
       <span class="ml-2 text-base font-semibold text-[#2d235a]">${NODES.length}</span>
     </div>
     <div class="bg-[#f8f6ff] rounded-xl border border-[#ddd6fe] px-4 py-2.5 text-xs">
       <span class="text-[#4929e2] font-medium">Agent 全自动</span>
       <span class="ml-2 text-base font-semibold text-[#4929e2]">${au}</span>
       <span class="text-[#8284A4] ml-1">/ 人机协同 ${NODES.length-au}</span>
     </div>`+
    Object.entries(TYPES).map(([k,v])=>
    `<div class="bg-white rounded-xl border border-gray-200 px-4 py-2.5 text-xs">
       <span class="inline-block w-2 h-2 rounded-full ${v.b} mr-1.5 align-middle"></span>
       <span class="text-[#8284A4]">${v.n}</span>
       <span class="ml-2 text-base font-semibold text-[#2d235a]">${cnt(k)}</span>
     </div>`).join('');
}

function renderLanes(){
  let h='<div class="lane-grid lane-head border-b border-gray-200 bg-[#f7f8fa] shadow-[0_2px_8px_rgba(0,0,0,.04)]">';
  h+='<div class="sticky-col bg-[#f7f8fa] border-r border-gray-200 px-3 py-3 text-xs font-semibold text-[#5c568a]">角色 \\ 阶段</div>';
  STAGES.forEach(s=>{
    const r=NODES.filter(n=>n.s===s.id).map(n=>n.q);
    h+=`<div class="px-3 py-3 border-r border-gray-100 bg-[#f7f8fa]">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-white bg-[#7033ff] rounded px-1.5 py-0.5">${s.id}</span>
            <span class="text-sm font-semibold text-[#1D2129]">${s.n}</span>
            <span class="text-[10px] text-[#8284A4] ml-auto">步骤 ${Math.min(...r)}-${Math.max(...r)}</span>
          </div>
          <div class="text-[11px] text-[#8284A4] mt-1.5">${s.tag} · 驱动：<span class="text-[#4929e2]">${s.agent}</span></div>
        </div>`;
  });
  h+='</div>';

  ROLES.forEach((r,ri)=>{
    const bg=ri%2?'bg-[#fcfcfd]':'bg-white';
    h+=`<div class="lane-grid ${bg} border-b border-gray-100">`;
    h+=`<div class="sticky-col ${bg} border-r border-gray-200 px-3 py-4">
          <div class="text-sm font-semibold text-[#2d235a]">${r.n}</div>
          <div class="text-[10.5px] text-[#8284A4] mt-1 leading-relaxed">${r.s}</div>
          <div class="text-[10px] text-[#c4b5fd] mt-2">${NODES.filter(n=>n.r===r.id).length} 节点</div>
        </div>`;
    STAGES.forEach(s=>{
      const ns=NODES.filter(n=>n.s===s.id&&n.r===r.id).sort((a,b)=>a.q-b.q);
      h+='<div class="px-3 py-3 border-r border-gray-100 space-y-2.5">';
      h+=ns.length?ns.map(n=>{
        const ty=TYPES[n.t];
        return `<div class="node ${ty.c} ${n.H?'':'node-auto'} p-2.5" data-t="${n.t}" data-q="${n.q}" data-auto="${n.H?0:1}">
          <div class="flex items-start gap-2">
            <span class="seq">${n.q}</span>
            <div class="text-xs font-semibold text-[#1D2129] leading-snug flex-1">${n.ti}</div>
            ${n.H?'':'<span class="auto-pill shrink-0">全自动</span>'}
            <span class="text-[10px] text-white ${ty.b} rounded px-1.5 py-0.5 shrink-0">${ty.n}</span>
          </div>
          ${chainHtml(n.ch)}
          ${n.H?actorBlock(n.H,'H'):''}
          ${actorBlock(n.A,'A')}
        </div>`;}).join(''):'<div class="h-full min-h-[36px]"></div>';
      h+='</div>';
    });
    h+='</div>';
  });

  h+='<div class="lane-grid lane-foot bg-[#f8f6ff] border-t border-[#ece8fd] shadow-[0_-2px_8px_rgba(0,0,0,.04)]">';
  h+='<div class="sticky-col bg-[#f8f6ff] border-r border-gray-200 px-3 py-3 text-xs font-semibold text-[#4929e2]">衔接信号</div>';
  STAGES.forEach(s=>{h+=`<div class="px-3 py-3 border-r border-gray-100 sig">
      <div class="text-[11px] font-mono text-[#4929e2]">${s.sig}</div>
      <div class="text-[11px] text-[#8284A4] mt-1.5">${s.ctx}</div>
    </div>`;});
  h+='</div>';
  document.getElementById('laneWrap').innerHTML=h;
  document.querySelectorAll('.node').forEach(el=>el.onclick=()=>openDrawer(+el.dataset.q));
}
function dBlock(o,who){
  const isH=who==='H';
  return `<div class="rounded-xl p-3.5 ${isH?'bg-[#e8eeff]':'bg-[#f0ebff]'}">
    <div class="text-xs font-bold ${isH?'text-[#3B4BFF]':'text-[#4929e2]'}">${isH?'人 负责':'Agent 负责'}</div>
    ${Object.entries(DIMS).map(([k,v])=>o[k]?
      `<div class="mt-2">
         <div class="text-[11px] font-semibold" style="color:${v.c}">${v.f}</div>
         <div class="text-xs text-[#4b5563] mt-0.5 leading-relaxed">${o[k]}</div>
       </div>`:'').join('')}
  </div>`;
}

function openDrawer(q){
  const n=NODES.find(x=>x.q===q), ty=TYPES[n.t];
  const st=STAGES.find(s=>s.id===n.s), ro=ROLES.find(r=>r.id===n.r);
  const prev=NODES.find(x=>x.q===q-1), next=NODES.find(x=>x.q===q+1);
  const navBtn=(t,lbl)=>t?`<button onclick="openDrawer(${t.q})" class="flex-1 text-left bg-[#f8f6ff] hover:bg-[#f0ebff] border border-[#ece8fd] rounded-lg px-2.5 py-2">
      <div class="text-[10px] text-[#8284A4]">${lbl}</div>
      <div class="text-[11px] text-[#4929e2] font-medium mt-0.5">${t.q}. ${t.ti}</div>
      <div class="text-[10px] text-[#8284A4] mt-0.5">${ROLES.find(r=>r.id===t.r).n}</div>
    </button>`:`<div class="flex-1 px-2.5 py-2 text-[10px] text-[#c4b5fd]">${lbl=='上一步'?'链路起点':'链路终点 · 回流 CR1'}</div>`;

  document.getElementById('drawerBody').innerHTML=
   `<div class="flex items-start justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="seq" style="min-width:26px;height:20px">${n.q}</span>
          <span class="text-[10px] font-bold text-white bg-[#7033ff] rounded px-1.5 py-0.5">${st.id}</span>
          <span class="text-[10px] text-white ${ty.b} rounded px-1.5 py-0.5">${ty.n}</span>
          ${n.H?'':'<span class="auto-pill">全自动</span>'}
        </div>
        <h2 class="text-base font-semibold text-[#1D2129] mt-2.5">${n.ti}</h2>
        <div class="text-xs text-[#8284A4] mt-1">${st.n} · ${ro.n} · 驱动：${st.agent}</div>
      </div>
      <button onclick="document.getElementById('drawer').classList.add('hide')" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
    </div>

    <div class="mt-4 bg-white border border-[#ece8fd] rounded-xl p-3.5">
      <div class="text-xs font-semibold text-[#5c568a]">节点内协同顺序</div>
      <div class="mt-2 space-y-1.5">
        ${n.ch.map((x,i)=>{const isH=x.startsWith('H ');
          return `<div class="flex items-center gap-2">
            <span class="text-[10px] text-[#c4b5fd] w-3">${i+1}</span>
            <span class="ch ${isH?'ch-h':'ch-a'}" style="font-size:11px;line-height:19px">${isH?'人':'AI'}</span>
            <span class="text-xs text-[#4b5563]">${x.slice(2)}</span>
          </div>`;}).join('')}
      </div>
    </div>

    <div class="mt-3 space-y-3">
      ${n.H?dBlock(n.H,'H'):
        `<div class="rounded-xl p-3.5 bg-[#ede9ff] border border-[#ddd6fe]">
           <div class="text-xs font-bold text-[#4929e2]">全自动节点 · 无需人介入</div>
           <div class="text-xs text-[#4b5563] mt-1.5 leading-relaxed">本节点由 Agent 端到端完成，人不在流程内。产出会进入下游节点由人复核或直接落库，异常与低置信情况才向人升级。</div>
         </div>`}
      ${dBlock(n.A,'A')}
    </div>

    <div class="mt-3 bg-[#f5f7fa] rounded-xl p-3.5">
      <div class="text-xs font-semibold text-[#5c568a]">本阶段衔接信号</div>
      <div class="text-xs font-mono text-[#4929e2] mt-1.5">${st.sig}</div>
      <div class="text-xs text-[#8284A4] mt-1.5">上下文增量：${st.ctx}</div>
    </div>

    <div class="mt-3 flex gap-2">${navBtn(prev,'上一步')}${navBtn(next,'下一步')}</div>`;
  document.getElementById('drawer').classList.remove('hide');
}

function renderBands(){
  document.getElementById('ctxBand').innerHTML=
   `<div class="bg-white rounded-2xl border border-gray-200 p-5">
      <div class="text-sm font-semibold text-[#2d235a]">统一上下文中枢 · 客户知识空间 / 项目空间</div>
      <p class="text-xs text-[#8284A4] mt-1.5 leading-relaxed">45 个节点的产出全部汇入同一份上下文。<span class="text-[#4929e2]">人只进入四类节点</span>：面客互动（访谈/谈判/汇报/验收）、现场执行（实施/环境切换）、不可逆承诺（报价/赢单/合同）、架构与技术选型。其余节点 Agent 端到端跑完，异常与低置信才向人升级。所有 AI 自动操作可回溯、可撤销。</p>
      <div class="mt-3 flex items-center gap-1.5 flex-wrap text-[11px] font-mono text-[#4929e2]">
        ${STAGES.map(s=>`<span class="bg-[#f0ebff] rounded px-2 py-1">${s.ctx.split(' ')[0]}</span>`).join('<span class="text-[#c4b5fd]">→</span>')}
      </div>
    </div>`;
  document.getElementById('loopBand').innerHTML=
   `<div class="bg-white rounded-2xl border border-gray-200 p-5">
      <div class="text-sm font-semibold text-[#2d235a]">闭环回流</div>
      <div class="text-xs text-[#4b5563] mt-2 leading-relaxed">
        步骤 41-45（CR7）产出的扩容信号 / 转介绍 →
        <span class="font-mono text-[#4929e2]">cross_sell_lead</span> →
        回流步骤 1-3（CR1/CR2）创建新线索；扩容方案通过则直接回到步骤 11（CR3 方案匹配）。
      </div>
      <div class="text-xs text-[#8284A4] mt-2">群协同：KA 主理智能体按群挂载项目空间，接收全部群消息，自主判断主动响应 / 静默沉淀 / 完全忽略。</div>
    </div>`;
}

renderFilters();renderStats();renderLanes();renderBands();
</script>
</body>
</html>
