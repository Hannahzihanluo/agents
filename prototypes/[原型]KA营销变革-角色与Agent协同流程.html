const SID={}; STAGES.forEach(s=>{if(!s.gate) SID[s.n]=s.id;});
const SEQ=[];
FLOW.forEach(b=>{
  if(b.gate){ SEQ.push({gate:b}); return; }
  (b.steps||[]).forEach(st=>SEQ.push({st,stage:b.s,sid:SID[b.s]}));
  if(b.split) b.split.cols.forEach(c=>
    c.steps.forEach(st=>SEQ.push({st,stage:b.s,sid:SID[b.s],br:c.n,q:b.split.q})));
});
const hit=(st,r)=>st.k!=='a'&&st.w.includes(r.n);
function neighbor(idx,r,dir){
  const br=SEQ[idx].br;
  for(let i=idx+dir;i>=0&&i<SEQ.length;i+=dir){
    const e=SEQ[i];
    if(e.gate) return {gate:e.gate.gate};
    if(e.br&&br&&e.br!==br) continue;
    if(e.st.k==='a') return {ai:e.st.w,o:e.st.o};
    if(e.st.w.includes(r.n)) return {same:1};
    return {role:e.st.w,stage:e.stage};
  }
  return null;
}
const sideHtml=(x,dir)=>{
  if(!x) return dir<0?'<span class="hnone">流程起点</span>':'<span class="hnone">流程终点</span>';
  if(x.gate) return `<span class="hgate">${esc(x.gate)}</span>`;
  if(x.ai) return `<span class="aidel">${esc(x.ai)}</span><span class="hv">${esc(x.o||'')}</span>`;
  if(x.same) return `<span class="hv">本角色${dir<0?'上':'下'}一步</span>`;
  return `<span class="hrole">${esc(x.role)}</span><span class="hv">${esc(x.stage)}</span>`;
};
function laneRows(r){
  const agSet=r.ag||[];
  const own=new Set(); SEQ.forEach(e=>{if(!e.gate&&hit(e.st,r)) own.add(e.sid);});
  const rows=[];
  SEQ.forEach((e,i)=>{
    if(e.gate){ if(e.gate.owner===r.n) rows.push({gate:e.gate}); return; }
    if(hit(e.st,r)){ rows.push({...e,mine:1,up:neighbor(i,r,-1),dn:neighbor(i,r,1)}); return; }
    if(e.st.k==='a'&&agSet.includes(e.st.w)){
      const nx=SEQ[i+1];
      const feeds=nx&&!nx.gate&&hit(nx.st,r);
      const hasA=(C[r.id+'|'+e.sid]||{}).A;
      if(feeds||own.has(e.sid)||hasA) rows.push({...e,ai:1,feeds:feeds?1:0});
    }
  });
  return rows;
}

  }
  document.getElementById('legend').innerHTML = view==='grid'
    ? `<span class="flex items-center gap-1"><span class="tag tag-h">人</span>人工执行 / 决策</span>
       <span class="flex items-center gap-1"><span class="tag tag-a">AI</span>Agent 自动处理</span>
       <span class="flex items-center gap-1"><span class="agt">Agent</span>该角色可用智能体</span>
       <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm" style="background:#fef3c7;border:1px solid #fde68a"></span>经营决策关卡</span>`
    : `<span class="flex items-center gap-1"><span class="tag tag-h">人</span>纯人工节点</span>
       <span class="flex items-center gap-1"><span class="tag tag-a">AI</span>Agent 全自动节点</span>
       <span class="flex items-center gap-1"><span class="tag tag-ha">AI辅助 + 人确认</span></span>
       <span class="flex items-center gap-1"><span class="ch ch-sys">系统操作</span><span class="ch ch-off">线下</span>行动方式</span>
       <span class="flex items-center gap-1"><span class="bdg bdg-lead">主导</span></span>
       <span class="flex items-center gap-1"><span class="bdg bdg-new">新增节点</span></span>`;
}
function setView(k){
  view=k;
  document.getElementById('wrap').classList.toggle('hidden',k!=='grid');
  document.getElementById('flow').classList.toggle('hidden',k!=='flow');
  document.getElementById('rolev').classList.toggle('hidden',k!=='role');
  document.getElementById('ctrl').classList.toggle('hidden',k!=='grid');
  document.getElementById('rolesel').classList.toggle('hidden',k!=='role');
  tabs();legend();
}
const MODES=[['all','全部'],['h','只看人'],['a','只看 Agent']];
let mode='all';
function ctrl(){
  document.getElementById('ctrl').innerHTML=MODES.map(([k,n])=>
    `<button onclick="setMode('${k}')" class="flt text-[11.5px] rounded-lg px-3 py-1.5 border ${
      mode===k?'bg-[#7033ff] text-white border-[#7033ff]':'bg-white text-[#4b5563] border-[#e5e0f5] hover:bg-[#f8f6ff]'
    }">${n}</button>`).join('');
}
function setMode(k){
  mode=k;
  const w=document.getElementById('wrap');
  w.classList.toggle('hide-a',k==='h');
  w.classList.toggle('hide-h',k==='a');
  ctrl();
}
render();renderFlow();renderRole();ctrl();rolesel();tabs();legend();
</script>
</body>
</html>
